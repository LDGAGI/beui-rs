[workspace]
resolver = "2"
members = [
    "crates/beui-theme",
    "crates/beui-core",
    "crates/beui",
    "crates/beui-agents",
    "crates/beui-charts",
    "gallery",
]
# `templates/starter` is a standalone app a consumer copies out; it depends on
# the published crates, not on this checkout, so it is not a workspace member.
exclude = ["templates"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/LDGAGI/beui-rs"
homepage = "https://github.com/LDGAGI/beui-rs"
rust-version = "1.85"
keywords = ["dioxus", "ui", "components", "tailwind", "motion"]
categories = ["gui", "web-programming"]

[workspace.dependencies]
dioxus = { version = "0.7.10", default-features = false }
dioxus-core = "0.7.10"
dioxus-hooks = "0.7.10"
dioxus-signals = "0.7.10"
dioxus-router = "0.7.10"
dioxus-web = { version = "0.7.10", default-features = false }
dioxus-motion = { version = "0.4.0", default-features = false }
dioxus-stores = "0.7.10"

wasm-bindgen = "0.2.100"
js-sys = "0.3.77"
web-sys = "0.3.77"
gloo-timers = { version = "0.4.0", features = ["futures"] }

beui-theme = { version = "0.1.0", path = "crates/beui-theme" }
beui-core = { version = "0.1.0", path = "crates/beui-core" }
beui = { version = "0.1.0", path = "crates/beui" }
beui-agents = { version = "0.1.0", path = "crates/beui-agents" }
beui-charts = { version = "0.1.0", path = "crates/beui-charts" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
