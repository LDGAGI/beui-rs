name: Release

# Tag push publishes the crates in dependency order. Requires a
# CARGO_REGISTRY_TOKEN repository secret (a crates.io API token scoped to this
# crate family).
on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install crates.io token
        run: cargo login "${CARGO_REGISTRY_TOKEN}"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # `beui-theme` needs `beui-core` in the index before it can be verified,
      # and the index update is not synchronous with the publish call.
      - name: Publish beui-core
        run: cargo publish -p beui-core && sleep 45
      - name: Publish beui-theme
        run: cargo publish -p beui-theme && sleep 45
      - name: Publish beui
        run: cargo publish -p beui && sleep 45
      - name: Publish beui-agents
        run: cargo publish -p beui-agents && sleep 45
      - name: Publish beui-charts
        run: cargo publish -p beui-charts
