name: Gallery

# The zero-install way to look at the library: a live page, no toolchain.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      - name: Install the Dioxus CLI
        run: cargo install dioxus-cli --version 0.7.10 --locked

      - id: pages
        uses: actions/configure-pages@v5

      # Project pages are served from /<repo>/, so the bundle's asset URLs need
      # that prefix. User/organisation pages resolve to "" and this is a no-op.
      - name: Set the base path
        run: |
          sed -i 's|base_path = ""|base_path = "${{ steps.pages.outputs.base_path }}"|' gallery/Dioxus.toml

      - name: Build
        run: dx build --platform web --release
        working-directory: gallery

      - uses: actions/upload-pages-artifact@v3
        with:
          path: gallery/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
