name: Gallery

# The zero-install way to look at the library: a live page, no toolchain.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      - name: Install the Dioxus CLI
        run: cargo install dioxus-cli --version 0.7.10 --locked

      - id: pages
        uses: actions/configure-pages@v5

      # Project pages are served from /<repo>/, so the bundle's asset URLs need
      # that prefix. User/organisation pages resolve to "" and this is a no-op.
      - name: Set the base path
        run: |
          sed -i 's|base_path = ""|base_path = "${{ steps.pages.outputs.base_path }}"|' gallery/Dioxus.toml

      - name: Build
        run: dx build --platform web --release
        working-directory: gallery
        env:
          # The `@font-face` rules are generated at runtime; this is the
          # compile-time override that keeps them under the project page's
          # `/beui-rs/` prefix. Empty on user/organisation pages.
          BEUI_FONT_BASE: "${{ steps.pages.outputs.base_path }}/assets/fonts"

      # `[web.resource].style` in Dioxus.toml is injected verbatim as an
      # absolute href, so the CLI's base path does not reach it. Prefix it here,
      # and serve the same document as 404.html so deep links such as
      # /beui-rs/button reach the router instead of GitHub's 404 page.
      - name: Fix public asset URLs and add the SPA fallback
        run: |
          out=target/dx/gallery/release/web/public
          base="${{ steps.pages.outputs.base_path }}"
          sed -i "s|href=\"/assets/tailwind.css\"|href=\"${base}/assets/tailwind.css\"|" "$out/index.html"
          cp "$out/index.html" "$out/404.html"

      - uses: actions/upload-pages-artifact@v3
        with:
          # `dx build` writes under the workspace target directory; the
          # application's `out_dir` setting does not change that.
          path: target/dx/gallery/release/web/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
